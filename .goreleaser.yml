builds:
  - id: arm64
    binary: trash
    main: hack.go
    goos:
      - darwin
    goarch:
      - arm64
    goarm64:
      - v8.0
    hooks:
      pre:
        - swift build -v -c release --arch arm64 --scratch-path .build-arm64
      post:
        - cp .build-arm64/out/Products/Release/trash dist/arm64_darwin_arm64_v8.0/trash
  - id: amd64
    binary: trash
    main: hack.go
    goos:
      - darwin
    goarch:
      - amd64
    goamd64:
      - v1
    hooks:
      pre:
        - swift build -v -c release --arch x86_64 --scratch-path .build-x86_64
      post:
        - cp .build-x86_64/out/Products/Release/trash dist/amd64_darwin_amd64_v1/trash

checksum:
  name_template: 'checksums.txt'

archives:
  - name_template: 'trash-v{{ .Version }}-{{ .Os }}-{{ .Arch }}'
