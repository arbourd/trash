name: ci

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: swift
        name: swift version
        run: |
          version=$(cat .swift-version | tr '\n' ' ')
          echo $version
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3
        with:
          swift-version: '${{ steps.swift.outputs.version }}'

      - name: Run swiftlint
        run: |
          brew install swiftlint
          swiftlint
      - run: swift test -v

  build:
    runs-on: macos-latest
    needs: [test]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: swift
        name: swift version
        run: |
          version=$(cat .swift-version | tr '\n' ' ')
          echo $version
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3
        with:
          swift-version: '${{ steps.swift.outputs.version }}'

      # swiftly rewrites .swift-version, which makes goreleaser see a dirty tree
      - run: git checkout -- .swift-version

      - run: swift build -v -c release --arch arm64 --scratch-path .build-arm64
      - run: swift build -v -c release --arch x86_64 --scratch-path .build-x86_64

      - run: brew install go
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: latest
          install-only: true

      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: goreleaser release --clean --snapshot --verbose

      - if: startsWith(github.ref, 'refs/tags/v')
        run: goreleaser release --clean --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
